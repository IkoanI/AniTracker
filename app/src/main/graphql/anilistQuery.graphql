fragment shortDetail on Media {
    title {
        userPreferred
    }
    averageScore
    coverImage {
        large
    }
    format
    id
    genres
    favourites
    status
    startDate {
        year
    }
    type
}

fragment animeShortDetail on Media {
    ...shortDetail
    season
    episodes
    duration

    nextAiringEpisode {
        timeUntilAiring
        episode
    }
}

fragment mangaShortDetail on Media {
    ...shortDetail
    endDate {
        year
    }
    volumes
}

query AnimeSearchPage ($pageNo : Int!, $userSearch : String, $sort:[MediaSort]){
    Page (page: $pageNo, perPage: 50){
        media (search: $userSearch, sort: $sort, type: ANIME){
            ...animeShortDetail
            studios(isMain:true){
                nodes{
                    name
                }
            }
        }
    }
}

query MangaSearchPage ($pageNo : Int!, $userSearch : String, $sort:[MediaSort]){
    Page (page: $pageNo, perPage: 50){
        media (search: $userSearch, sort: $sort, type: MANGA){
            ...mangaShortDetail
        }
    }
}

fragment detail on Media {
    ...shortDetail
    title {
        userPreferred
        romaji
        native
        english
    }
    startDate {
        year
        month
        day
    }
    endDate {
        year
        month
        day
    }
    description
    bannerImage
    trailer {
        id
        site
        thumbnail
    }
    synonyms
    source
    meanScore
    popularity
    hashtag
    tags {
        name
        rank
        isMediaSpoiler
        isGeneralSpoiler
    }
}

fragment animeDetail on Media {
    ...detail
    ...animeShortDetail
    studios {
        edges {
            isMain
            node {
                name
                isAnimationStudio
            }
        }
    }
}

fragment mangaDetail on Media {
    ...detail
    ...mangaShortDetail
    chapters
}

query AnimeMoreDetails($id : Int!){
    Media(id: $id, type: ANIME) {
        ...animeDetail
    }
}

query MangaMoreDetails($id : Int!) {
    Media(id: $id, type: MANGA){
        ...mangaDetail
    }
}

fragment shortCharDetail on Character {
    name {
        userPreferred
    }
    id
    image {
        large
    }
}

fragment shortStaffDetail on Staff {
    id
    name {
        userPreferred
    }
    image{
        large
    }
}

query characterPage($mediaId : Int!, $pageNo : Int!, $language : StaffLanguage!) {
    Media(id: $mediaId) {
        characters(page: $pageNo, perPage: 25, sort: [ROLE, RELEVANCE, ID]) {
            edges {
                role
                voiceActorRoles(language: $language) {
                    roleNotes
                    voiceActor {
                        ...shortStaffDetail
                    }
                }
                node {
                    ...shortCharDetail
                }
            }
        }
    }
}

query staffPage ($mediaId : Int!, $pageNo : Int!) {
    Media(id: $mediaId) {
        staff(page: $pageNo, perPage: 25, sort: [RELEVANCE, ROLE]) {
            edges {
                role
                node {
                    ...shortStaffDetail
                }
            }
        }
    }
}

query relationsPage($mediaId : Int!) {
    Media(id: $mediaId) {
        relations {
            edges {
                relationType
                node {
                    ...shortDetail
                }
            }
        }
    }
}

fragment charDetail on Character {
    ...shortCharDetail
    name {
        first
        middle
        last
        full
        native
        userPreferred
        alternative
        alternativeSpoiler
    }
    description(asHtml: true)
    gender
    dateOfBirth {
        year
        month
        day
    }
    age
    bloodType
    favourites
}

query CharacterDetail($id : Int!) {
    Character(id: $id) {
       ...charDetail
    }
}