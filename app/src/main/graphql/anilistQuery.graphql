fragment shortDetail on Media {
    title {
        userPreferred
    }
    averageScore
    coverImage {
        large
    }
    format
    id
    genres
    favourites
    status
    startDate {
        year
    }
}

fragment animeShortDetail on Media {
    ...shortDetail
    season
    episodes
    duration

    nextAiringEpisode {
        timeUntilAiring
        episode
    }

    type
}

fragment mangaShortDetail on Media {
    ...shortDetail
    endDate {
        year
    }
    volumes
}

query AnimeSearchPage ($pageNo : Int!, $userSearch : String, $sort:[MediaSort]){
    Page (page: $pageNo, perPage: 50){
        media (search: $userSearch, sort: $sort, type: ANIME){
            ...animeShortDetail
            studios(isMain:true){
                nodes{
                    name
                }
            }
        }
    }
}

query MangaSearchPage ($pageNo : Int!, $userSearch : String, $sort:[MediaSort]){
    Page (page: $pageNo, perPage: 50){
        media (search: $userSearch, sort: $sort, type: MANGA){
            ...mangaShortDetail
        }
    }
}

fragment detail on Media {
    ...shortDetail
    title {
        userPreferred
        romaji
        native
        english
    }
    startDate {
        year
        month
        day
    }
    endDate {
        year
        month
        day
    }
    description
    bannerImage
    trailer {
        id
        site
        thumbnail
    }
    synonyms
    source
    meanScore
    popularity
    hashtag
    tags {
        name
        rank
        isMediaSpoiler
        isGeneralSpoiler
    }
}

fragment animeDetail on Media {
    ...detail
    ...animeShortDetail
    studios {
        edges {
            isMain
            node {
                name
                isAnimationStudio
            }
        }
    }
}

fragment mangaDetail on Media {
    ...detail
    ...mangaShortDetail
    chapters
}

query AnimeMoreDetails($id : Int!){
    Media(id: $id, type: ANIME) {
        ...animeDetail
    }
}

query MangaMoreDetails($id : Int!) {
    Media(id: $id, type: MANGA){
        ...mangaDetail
    }
}

query characterPage($mediaId : Int!, $pageNo : Int!, $language : StaffLanguage!) {
    Media(id: $mediaId) {
        characters(page: $pageNo, perPage: 25, sort: [ROLE, RELEVANCE, ID]) {
            edges {
                role
                voiceActorRoles(language: $language) {
                    roleNotes
                    voiceActor {
                        name {
                            userPreferred
                        }
                        image{
                            large
                        }
                    }
                }
                node {
                    name {
                        userPreferred
                    }
                    id
                    image {
                        large
                    }
                }
            }
        }
    }
}

query staffPage ($mediaId : Int!, $pageNo : Int!) {
    Media(id: $mediaId) {
        staff(page: $pageNo, perPage: 25, sort: [RELEVANCE, ID]) {
            edges {
                role
                node {
                    name {
                        userPreferred
                    }
                    image {
                        large
                    }
                }
            }
        }
    }
}

query relationsPage($mediaId : Int!) {
    Media(id: $mediaId) {
        relations {
            edges {
                relationType
                node {
                    title {
                        userPreferred
                    }
                    coverImage {
                        large
                    }
                    format
                    status
                    type
                    id
                }
            }
        }
    }
}